server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for any route that isn't a real file
    # (lets React Router handle navigation client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* → backend:8000/*  (strips the /api prefix, same as Vite proxy)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /uploads/* → backend:8000/uploads/*
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }
}
